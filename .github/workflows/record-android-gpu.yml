name: record-android-gpu
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: Emulator GPU mode
        default: swiftshader_indirect
      script:
        description: Script under scripts/ to run
        default: perf3.sh
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu ${{ inputs.gpu }} -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings
          path: out/
      - name: Publish sample to branch sample-out
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan sample-out
          git rm -rf . >/dev/null 2>&1 || true
          cp -r out/* . 2>/dev/null || true
          git add -A -- . ':!out'
          git commit -m "Sample recording output" || true
          git push -f origin sample-out
